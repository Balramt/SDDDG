[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verbalizer"
version = "0.1.0"
description = "Natural Language Generation framework for Semantic Web data (OWL, SPARQL, DL, Triples)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Balram Tiwari", email = "your.email@example.com" }
]
keywords = ["semantic-web", "owl", "sparql", "description-logic", "nlp", "verbalizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies required for core operations
dependencies = [
    "owlapy>=1.3.0",
    "inflect>=7.0.0",
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
]

# Optional dependencies for LLM integration and development
#[project.optional-dependencies]
#llm = [
 #   "openai>=1.0.0",
  #  "ollama>=0.1.0",
#]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

# Executable command-line tool
[project.scripts]
verbalizer = "verbalizer.owl2nl.core:cli_main"

# Tells Hatchling to package the entire src/verbalizer directory
[tool.hatch.build.targets.wheel]
packages = ["src/verbalizer"]